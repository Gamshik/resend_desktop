[package]
name = "resend-desktop"
version = "0.1.0"
description = "Desktop client for sending email through Resend"
authors = ["Gamshik"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (needed on Windows).
name = "resend_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Platform secure storage: Android Keystore / iOS+macOS Keychain / Windows Credential Manager / Secret Service
tauri-plugin-secure-store = { path = "plugins/secure-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Non-secret local data (history, settings). `bundled` ships SQLite so no system lib is needed.
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
